name: Code Quality

on:
  push:
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 'great-expectations>=1.24.0' 'kagglehub>=1.0.2'

      - name: Check formatting with Black
        run: black --check src tests

      - name: Lint with Flake8
        run: flake8 src tests

      - name: Download validation data
        run: |
          python - <<'PY'
          from pathlib import Path
          import kagglehub

          data_dir = Path("data/raw")
          data_dir.mkdir(parents=True, exist_ok=True)
          kagglehub.dataset_download(
              "uciml/default-of-credit-card-clients-dataset",
              output_dir=str(data_dir),
          )
          PY

      - name: Validate data with Great Expectations
        run: python src/data/validation_gx.py
